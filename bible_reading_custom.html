<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Bible Reading Plans</title>
  <style>
    :root {
      --bg: #fdf6e3;
      --bg-card: #fefaf0;
      --bg-done: #eef5e8;
      --gold: #b5860d;
      --gold-light: #fdf0c0;
      --text: #3b2f10;
      --text-muted: #8a7045;
      --green: #4a7c59;
      --border: #e8d9b0;
      --border-done: #a8c9a0;
      --shadow: rgba(100, 70, 20, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .header-icon { font-size: 34px; color: var(--gold); line-height: 1; flex-shrink: 0; }

    .header-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: normal;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* ── Builder ── */
    .builder {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .builder-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .builder-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    /* Toggle groups */
    .toggle-group { display: flex; }

    .toggle-btn {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .toggle-btn:not(:first-child) { margin-left: -1px; }
    .toggle-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .toggle-btn:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }

    .toggle-btn.active {
      background: var(--gold-light);
      color: var(--gold);
      border-color: var(--gold);
      z-index: 1;
    }

    .toggle-btn:not(.active):hover {
      background: var(--gold-light);
      color: var(--text);
    }

    /* Days */
    .days-wrap { display: flex; flex-direction: column; }

    .days-input {
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      width: 80px;
      outline: none;
    }

    .days-input:focus { border-color: var(--gold); }
    .days-input.invalid { border-color: #c0392b; }

    input[type="number"] {
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
    }

    .days-hint {
      font-size: 11px;
      color: #c0392b;
      margin-top: 3px;
      display: none;
    }

    .days-hint.visible { display: block; }

    /* Name */
    .name-input {
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      flex: 1;
      min-width: 140px;
      outline: none;
    }

    .name-input:focus { border-color: var(--gold); }

    /* Create button */
    .create-btn {
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      background: var(--gold);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .create-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .create-btn:not(:disabled):hover { opacity: 0.85; }

    /* ── Tabs row ── */
    .tabs-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { background: var(--gold-light); color: var(--text); border-color: var(--gold); }
    .tab-btn.active { background: var(--gold-light); color: var(--gold); border-color: var(--gold); font-weight: 600; }

    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    .tab-delete {
      font-size: 13px;
      line-height: 1;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 1px;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .tab-delete:hover { color: #c0392b; }

    /* Delete confirm */
    .tab-confirm {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .confirm-btn {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .confirm-yes { background: #c0392b; color: #fff; }
    .confirm-no  { background: var(--border); color: var(--text); }

    /* + New Plan button */
    .new-plan-btn {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      border: 1px dashed var(--gold);
      border-radius: var(--radius);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .new-plan-btn:hover { background: var(--gold-light); }

    /* ── Plan display (identical to existing app) ── */
    .plan-header { margin-bottom: 1.25rem; }

    .plan-title { font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 4px; }

    .plan-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }

    .start-date-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      min-height: 28px;
    }

    .start-btn {
      font-size: 12px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .start-btn:hover { border-color: var(--gold); color: var(--gold); }

    .link-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .date-input {
      font-size: 12px;
      padding: 5px 9px;
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text);
      outline: none;
    }

    .plan-status-note { font-style: italic; color: var(--text-muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .stat-val { font-size: 24px; font-weight: 600; color: var(--gold); }
    .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      flex: 1;
      min-width: 120px;
      max-width: 220px;
    }

    .search-box:focus { border-color: var(--gold); }

    .ctrl-btn {
      font-size: 12px;
      padding: 7px 14px;
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--gold);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }

    .ctrl-btn:hover { background: var(--gold-light); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }

    .day-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: var(--bg-card);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
      min-height: 64px;
    }

    .day-card:hover { border-color: var(--gold); box-shadow: 0 2px 8px var(--shadow); }
    .day-card.done { background: var(--bg-done); border-color: var(--border-done); }
    .day-card.done .day-num  { color: var(--green); }
    .day-card.done .chapters { color: var(--green); opacity: 0.85; }
    .day-card.today { background: var(--gold-light); border: 1.5px solid var(--gold); }
    .day-card.today .day-num { color: var(--gold); font-weight: 700; }
    .day-card.today.done { background: var(--bg-done); border-color: var(--green); }
    .day-card.today.done .day-num { color: var(--green); }

    .day-num {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chapters { font-size: 13px; color: var(--text); line-height: 1.55; }

    .check {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 14px;
      color: var(--green);
      display: none;
    }

    .day-card.done .check { display: block; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      body { padding: 1rem 0.75rem; }
      .header-title { font-size: 19px; }
      .grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <span class="header-icon">✝</span>
    <div>
      <h1 class="header-title">Custom Bible Reading Plans</h1>
      <p class="header-sub">Build your own reading plan — any corpus, any length</p>
    </div>
  </header>

  <div class="builder" id="builder">
    <div class="builder-title">New Reading Plan</div>
    <div class="builder-row">
      <div class="toggle-group" id="corpus-group">
        <button class="toggle-btn active" data-corpus="OT">OT</button>
        <button class="toggle-btn" data-corpus="NT">NT</button>
        <button class="toggle-btn" data-corpus="Full">Full Bible</button>
      </div>
      <div class="toggle-group" id="order-group">
        <button class="toggle-btn active" data-order="sequential">Sequential</button>
        <button class="toggle-btn" data-order="chronological">Chronological</button>
      </div>
      <div class="days-wrap">
        <input class="days-input" id="days-input" type="number" min="7" max="365" placeholder="Days">
        <span class="days-hint" id="days-hint">Enter 7–365</span>
      </div>
      <input class="name-input" id="name-input" type="text" placeholder="Plan name (optional)" maxlength="40">
      <button class="create-btn" id="create-btn" disabled onclick="createPlan()">Create Plan</button>
    </div>
  </div>

  <div class="tabs-row" id="tabs-row" style="display:none"></div>

  <div id="plan-display" style="display:none">
    <div class="plan-header">
      <div class="plan-title" id="plan-title"></div>
      <div class="plan-sub"   id="plan-sub"></div>
      <div class="start-date-line" id="start-date-line"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-val" id="s-days"></div><div class="stat-lbl">total days</div></div>
      <div class="stat"><div class="stat-val" id="s-done"></div><div class="stat-lbl">days completed</div></div>
      <div class="stat"><div class="stat-val" id="s-pct"></div> <div class="stat-lbl">% complete</div></div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>

    <div class="controls">
      <input class="search-box" type="text" placeholder="Search book…" id="search" oninput="renderCards()">
      <button class="ctrl-btn" onclick="markAll(true)">Mark all done</button>
      <button class="ctrl-btn" onclick="markAll(false)">Reset</button>
    </div>

    <div class="grid" id="grid"></div>
  </div>

</div>
<script>
// ── Bible data ───────────────────────────────────────────────────────────────
const OT_CHAPTERS = {
  Genesis:50,Exodus:40,Leviticus:27,Numbers:36,Deuteronomy:34,
  Joshua:24,Judges:21,Ruth:4,"1 Samuel":31,"2 Samuel":24,
  "1 Kings":22,"2 Kings":25,"1 Chronicles":29,"2 Chronicles":36,
  Ezra:10,Nehemiah:13,Esther:10,Job:42,Psalms:150,Proverbs:31,
  Ecclesiastes:12,"Song of Solomon":8,Isaiah:66,Jeremiah:52,Lamentations:5,
  Ezekiel:48,Daniel:12,Hosea:14,Joel:3,Amos:9,Obadiah:1,Jonah:4,
  Micah:7,Nahum:3,Habakkuk:3,Zephaniah:3,Haggai:2,Zechariah:14,Malachi:4
};

const NT_CHAPTERS = {
  Matthew:28,Mark:16,Luke:24,John:21,Acts:28,
  Romans:16,"1 Corinthians":16,"2 Corinthians":13,
  Galatians:6,Ephesians:6,Philippians:4,Colossians:4,
  "1 Thessalonians":5,"2 Thessalonians":3,
  "1 Timothy":6,"2 Timothy":4,Titus:3,Philemon:1,
  Hebrews:13,James:5,"1 Peter":5,"2 Peter":3,
  "1 John":5,"2 John":1,"3 John":1,Jude:1,Revelation:22
};

const OT_SEQ   = Object.keys(OT_CHAPTERS);
const NT_SEQ   = Object.keys(NT_CHAPTERS);
const FULL_SEQ = [...OT_SEQ, ...NT_SEQ];

const OT_CHRON = [
  "Genesis","Job","Exodus","Leviticus","Numbers","Deuteronomy",
  "Joshua","Judges","Ruth","1 Samuel","2 Samuel","Psalms",
  "Proverbs","Ecclesiastes","Song of Solomon",
  "1 Kings","2 Kings","1 Chronicles","2 Chronicles",
  "Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel",
  "Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum",
  "Habakkuk","Zephaniah","Haggai","Zechariah","Malachi",
  "Ezra","Nehemiah","Esther"
];

const NT_CHRON = [
  "James","Galatians","1 Thessalonians","2 Thessalonians",
  "1 Corinthians","2 Corinthians","Romans","Philippians",
  "Colossians","Ephesians","Philemon","1 Timothy","Titus",
  "2 Timothy","Hebrews","Matthew","Mark","Luke","Acts",
  "John","1 Peter","2 Peter","Jude","1 John","2 John","3 John","Revelation"
];

const FULL_CHRON = [...OT_CHRON, ...NT_CHRON];

const ALL_CHAPTERS = { ...OT_CHAPTERS, ...NT_CHAPTERS };
const CORPUS_MAX = {
  OT:   OT_SEQ.reduce((s, b) => s + OT_CHAPTERS[b], 0),
  NT:   NT_SEQ.reduce((s, b) => s + NT_CHAPTERS[b], 0),
  Full: FULL_SEQ.reduce((s, b) => s + ALL_CHAPTERS[b], 0)
};

function getOrder(corpus, order) {
  if (corpus === 'OT') return order === 'sequential' ? OT_SEQ   : OT_CHRON;
  if (corpus === 'NT') return order === 'sequential' ? NT_SEQ   : NT_CHRON;
  return order === 'sequential' ? FULL_SEQ : FULL_CHRON;
}

// ── Plan builder algorithm ───────────────────────────────────────────────────
function buildPlan(bookOrder, days) {
  const total = bookOrder.reduce((s, b) => s + ALL_CHAPTERS[b], 0);
  const perDay = total / days;
  const pool = [];
  for (const book of bookOrder)
    for (let c = 1; c <= ALL_CHAPTERS[book]; c++) pool.push({ book, ch: c });
  const plan = [];
  let idx = 0;
  for (let d = 0; d < days; d++) {
    const target = Math.round((d + 1) * perDay);
    const dayChaps = [];
    while (idx < target && idx < pool.length) { dayChaps.push(pool[idx]); idx++; }
    if (dayChaps.length === 0 && idx < pool.length) { dayChaps.push(pool[idx]); idx++; }
    plan.push(dayChaps);
  }
  return plan;
}

function formatDay(chaps) {
  if (!chaps || chaps.length === 0) return "—";
  const groups = [];
  let i = 0;
  while (i < chaps.length) {
    const book = chaps[i].book;
    const start = chaps[i].ch;
    let end = start;
    while (i + 1 < chaps.length && chaps[i+1].book === book && chaps[i+1].ch === end + 1) {
      i++; end = chaps[i].ch;
    }
    groups.push(start === end ? `${book} ${start}` : `${book} ${start}–${end}`);
    i++;
  }
  return groups.join("; ");
}

// ── Plan schedule cache (avoid rebuilding on every card toggle) ──────────────
const planCache = new Map();

function getBuiltPlan(plan) {
  if (!planCache.has(plan.id)) {
    planCache.set(plan.id, buildPlan(getOrder(plan.corpus, plan.order), plan.days));
  }
  return planCache.get(plan.id);
}

// ── State ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'bible-custom-plans';
let plans = [];
let currentId = null;
let scrolledToToday = false;
let builderCorpus = 'OT';
let builderOrder  = 'sequential';

// ── Storage ──────────────────────────────────────────────────────────────────
function loadPlans() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(plan => {
          plan.progress = Array.from({ length: plan.days }, (_, i) => !!plan.progress[i]);
        });
        return arr;
      }
    }
  } catch(e) {}
  return [];
}

function savePlans() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(plans)); } catch(e) {}
}

// ── Builder wiring ───────────────────────────────────────────────────────────
document.getElementById('corpus-group').addEventListener('click', e => {
  const btn = e.target.closest('.toggle-btn');
  if (!btn) return;
  builderCorpus = btn.dataset.corpus;
  document.querySelectorAll('#corpus-group .toggle-btn')
    .forEach(b => b.classList.toggle('active', b === btn));
  daysInput.max = CORPUS_MAX[builderCorpus];
  // Re-validate current value against new max
  const v = parseInt(daysInput.value, 10);
  const valid = !isNaN(v) && v >= 7 && v <= CORPUS_MAX[builderCorpus];
  daysInput.classList.toggle('invalid',  daysInput.value !== '' && !valid);
  daysHint.classList.toggle('visible',   daysInput.value !== '' && !valid);
  createBtn.disabled = !valid;
});

document.getElementById('order-group').addEventListener('click', e => {
  const btn = e.target.closest('.toggle-btn');
  if (!btn) return;
  builderOrder = btn.dataset.order;
  document.querySelectorAll('#order-group .toggle-btn')
    .forEach(b => b.classList.toggle('active', b === btn));
});

const daysInput = document.getElementById('days-input');
const daysHint  = document.getElementById('days-hint');
const createBtn = document.getElementById('create-btn');

daysInput.addEventListener('input', () => {
  const v = parseInt(daysInput.value, 10);
  const valid = !isNaN(v) && v >= 7 && v <= CORPUS_MAX[builderCorpus];
  daysInput.classList.toggle('invalid',  daysInput.value !== '' && !valid);
  daysHint.classList.toggle('visible',   daysInput.value !== '' && !valid);
  createBtn.disabled = !valid;
});

function autoName(corpus, order, days) {
  const c = corpus === 'Full' ? 'Full Bible' : corpus;
  const o = order === 'sequential' ? 'Sequential' : 'Chronological';
  return `${c} · ${o} · ${days} days`;
}

function createPlan() {
  const days = parseInt(daysInput.value, 10);
  if (isNaN(days) || days < 7 || days > CORPUS_MAX[builderCorpus]) return;
  const nameVal = document.getElementById('name-input').value.trim();
  const name    = nameVal || autoName(builderCorpus, builderOrder, days);
  const plan = {
    id:       'plan_' + Date.now(),
    name,
    corpus:   builderCorpus,
    order:    builderOrder,
    days,
    progress: new Array(days).fill(false),
    start:    null
  };
  plans.push(plan);
  savePlans();
  collapseBuilder();
  switchPlan(plan.id);
}

function collapseBuilder() {
  document.getElementById('builder').style.display = 'none';
}

function expandBuilder() {
  builderCorpus = 'OT';
  builderOrder  = 'sequential';
  document.querySelectorAll('#corpus-group .toggle-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  document.querySelectorAll('#order-group .toggle-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  daysInput.max = CORPUS_MAX[builderCorpus];
  daysInput.value = '';
  daysInput.classList.remove('invalid');
  daysHint.classList.remove('visible');
  createBtn.disabled = true;
  document.getElementById('name-input').value = '';
  document.getElementById('builder').style.display = '';
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
function renderTabs() {
  const row = document.getElementById('tabs-row');
  row.innerHTML = '';

  if (plans.length === 0) {
    row.style.display = 'none';
    document.getElementById('plan-display').style.display = 'none';
    expandBuilder();
    return;
  }

  row.style.display = 'flex';

  plans.forEach(plan => {
    const tab = document.createElement('div');
    tab.className = 'tab-btn' + (plan.id === currentId ? ' active' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'tab-name';
    nameSpan.title = plan.name;
    nameSpan.textContent = plan.name.length > 20 ? plan.name.slice(0, 19) + '…' : plan.name;

    const delBtn = document.createElement('button');
    delBtn.className = 'tab-delete';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete this plan';
    delBtn.onclick = e => { e.stopPropagation(); showDeleteConfirm(plan.id, row, tab); };

    tab.onclick = () => switchPlan(plan.id);
    tab.appendChild(nameSpan);
    tab.appendChild(delBtn);
    row.appendChild(tab);
  });

  const newBtn = document.createElement('button');
  newBtn.className = 'new-plan-btn';
  newBtn.textContent = '＋ New Plan';
  newBtn.onclick = expandBuilder;
  row.appendChild(newBtn);
}

function showDeleteConfirm(planId, row, originalTab) {
  const plan = plans.find(p => p.id === planId);
  if (!plan) return;
  const shortName = plan.name.length > 15 ? plan.name.slice(0, 14) + '…' : plan.name;

  const confirm = document.createElement('div');
  confirm.className = 'tab-confirm';

  const label = document.createElement('span');
  label.textContent = `Delete "${shortName}"?`;
  confirm.appendChild(label);

  const yes = document.createElement('button');
  yes.className = 'confirm-btn confirm-yes';
  yes.textContent = 'Delete';
  yes.onclick = () => deletePlan(planId);
  confirm.appendChild(yes);

  const no = document.createElement('button');
  no.className = 'confirm-btn confirm-no';
  no.textContent = 'Cancel';
  no.onclick = renderTabs;
  confirm.appendChild(no);

  row.replaceChild(confirm, originalTab);
}

function deletePlan(planId) {
  const idx = plans.findIndex(p => p.id === planId);
  if (idx === -1) return;
  plans.splice(idx, 1);
  planCache.delete(planId);
  savePlans();

  if (plans.length === 0) {
    currentId = null;
    renderTabs();
    return;
  }

  if (currentId === planId) {
    currentId = plans[Math.min(idx, plans.length - 1)].id;
  }

  renderTabs();
  renderActivePlan();
}

// ── Plan display ─────────────────────────────────────────────────────────────
function switchPlan(id) {
  currentId = id;
  scrolledToToday = false;
  document.getElementById('search').value = '';
  renderTabs();
  renderActivePlan();
}

function renderActivePlan() {
  const plan = plans.find(p => p.id === currentId);
  if (!plan) return;
  document.getElementById('plan-display').style.display = '';

  const corpusLabel = plan.corpus === 'Full' ? 'Full Bible'
                    : plan.corpus === 'OT'   ? 'Old Testament'
                    :                          'New Testament';
  const orderLabel  = plan.order === 'sequential' ? 'sequential order' : 'chronological order';

  document.getElementById('plan-title').textContent = plan.name;
  document.getElementById('plan-sub').textContent   = `${corpusLabel} · ${plan.days} days · ${orderLabel}`;

  renderStartDateLine();
  updateStats();
  renderCards();
}

function getTodayIndex() {
  const plan = plans.find(p => p.id === currentId);
  if (!plan || !plan.start) return null;
  const startMs = new Date(plan.start + 'T00:00:00').getTime();
  const t = new Date();
  const todayMs = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
  return Math.floor((todayMs - startMs) / 86400000);
}

function renderStartDateLine() {
  const plan = plans.find(p => p.id === currentId);
  if (!plan) return;
  const line     = document.getElementById('start-date-line');
  const todayIdx = getTodayIndex();
  line.innerHTML = '';

  if (!plan.start) {
    const btn = document.createElement('button');
    btn.className = 'start-btn';
    btn.textContent = 'Set start date';
    btn.onclick = showDateInput;
    line.appendChild(btn);
    return;
  }

  const dateLabel = new Date(plan.start + 'T00:00:00')
    .toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  const startSpan = document.createElement('span');
  startSpan.textContent = 'Started: ' + dateLabel;
  line.appendChild(startSpan);
  line.appendChild(document.createTextNode(' · '));

  const changeBtn = document.createElement('button');
  changeBtn.className = 'link-btn';
  changeBtn.textContent = 'Change';
  changeBtn.onclick = showDateInput;
  line.appendChild(changeBtn);

  if (todayIdx !== null) {
    if (todayIdx >= plan.days) {
      line.appendChild(document.createTextNode(' · '));
      const note = document.createElement('span');
      note.className = 'plan-status-note';
      note.textContent = 'Plan complete 🎉';
      line.appendChild(note);
    } else if (todayIdx < 0) {
      const n = -todayIdx;
      line.appendChild(document.createTextNode(' · '));
      const note = document.createElement('span');
      note.className = 'plan-status-note';
      note.textContent = `Starting in ${n} day${n === 1 ? '' : 's'}`;
      line.appendChild(note);
    }
  }
}

function showDateInput() {
  const plan = plans.find(p => p.id === currentId);
  if (!plan) return;
  const line  = document.getElementById('start-date-line');
  line.innerHTML = '';
  const input = document.createElement('input');
  input.className = 'date-input';
  input.type = 'date';
  if (plan.start) input.value = plan.start;
  line.appendChild(input);
  input.focus();

  let committed = false;
  input.onchange = () => {
    committed = true;
    plan.start = input.value || null;
    savePlans();
    scrolledToToday = false;
    renderStartDateLine();
    renderCards();
  };
  input.onblur = () => { if (!committed) setTimeout(renderStartDateLine, 200); };
}

function updateStats() {
  const plan = plans.find(p => p.id === currentId);
  if (!plan) return;
  const done = plan.progress.filter(Boolean).length;
  const pct  = Math.round(done / plan.days * 100);
  document.getElementById('s-days').textContent = plan.days;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-pct').textContent  = pct + '%';
  document.getElementById('prog').style.width   = pct + '%';
}

function renderCards() {
  const plan = plans.find(p => p.id === currentId);
  if (!plan) return;
  const q         = document.getElementById('search').value.toLowerCase().trim();
  const todayIdx  = getTodayIndex();
  const builtPlan = getBuiltPlan(plan);
  const grid      = document.getElementById('grid');
  grid.innerHTML  = '';
  let todayCard   = null;

  builtPlan.forEach((chaps, d) => {
    const label = formatDay(chaps);
    if (q && !label.toLowerCase().includes(q)) return;

    const isToday = (todayIdx === d);
    const isDone  = plan.progress[d];

    const card = document.createElement('div');
    card.className = 'day-card' + (isDone ? ' done' : '') + (isToday ? ' today' : '');

    const dayNumDiv = document.createElement('div');
    dayNumDiv.className = 'day-num';
    if (isToday) {
      const strong = document.createElement('strong');
      strong.style.cssText = 'font-size:11px;letter-spacing:.05em;text-transform:uppercase;';
      strong.textContent = 'Today';
      dayNumDiv.appendChild(strong);
    } else {
      dayNumDiv.textContent = `Day ${d + 1}`;
    }

    const chapDiv = document.createElement('div');
    chapDiv.className = 'chapters';
    chapDiv.textContent = label;

    const checkSpan = document.createElement('span');
    checkSpan.className = 'check';
    checkSpan.setAttribute('aria-hidden', 'true');
    checkSpan.textContent = '✓';

    card.appendChild(dayNumDiv);
    card.appendChild(chapDiv);
    card.appendChild(checkSpan);

    card.onclick = () => {
      plan.progress[d] = !plan.progress[d];
      savePlans();
      updateStats();
      renderCards();
    };

    grid.appendChild(card);
    if (isToday) todayCard = card;
  });

  if (todayCard && !scrolledToToday) {
    scrolledToToday = true;
    setTimeout(() => todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
  }
}

function markAll(val) {
  const plan = plans.find(p => p.id === currentId);
  if (!plan) return;
  plan.progress.fill(val);
  if (!val) {
    plan.start = null;
    scrolledToToday = false;
    renderStartDateLine();
  }
  savePlans();
  updateStats();
  renderCards();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
plans = loadPlans();

if (plans.length > 0) {
  currentId = plans[0].id;
  collapseBuilder();
  renderTabs();
  renderActivePlan();
} else {
  renderTabs();
}
</script>
